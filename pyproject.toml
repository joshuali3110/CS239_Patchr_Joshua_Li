[project]
name = "patchr"
version = "0.1.0"
description = "Patchr: a multi-agent bug-fix and release pipeline (CS239 project)"
readme = "src/README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.50",
    # The run_tests and health_check tools run pytest against the sandbox workspace.
    "pytest>=8",
]

[project.scripts]
patchr = "patchr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patchr"]

[tool.pytest.ini_options]
# Only Patchr's own tests; the tinyshop tests inside world_template run in sandboxes.
testpaths = ["tests"]
